name: upstream-watch

# Daily: opens an issue for a new stable cs-firewall-bouncer release, with the
# values for the three ARGs in the Dockerfile. Builds nothing.

on:
  workflow_dispatch:
  schedule:
    # Not at minute 0: GitHub delays or drops scheduled runs at the start of
    # the hour.
    - cron: "37 6 * * *"

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Watch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          current=$(sed -n 's/^ARG VERSION=//p' Dockerfile)
          latest=$(gh api repos/crowdsecurity/cs-firewall-bouncer/releases/latest --jq .tag_name)
          echo "Dockerfile $current, upstream $latest"
          [ "$latest" != "$current" ] || exit 0
          title="cs-firewall-bouncer $latest"
          if gh issue list -R "$REPO" --state all --search "in:title \"$title\"" --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Issue exists"; exit 0
          fi
          digests=$(gh api "repos/crowdsecurity/cs-firewall-bouncer/releases/tags/$latest" \
            --jq '.assets[] | select(.name | test("^crowdsec-firewall-bouncer-linux-(amd64|arm64)\\.tgz$")) | "\(.name) \(.digest)"')
          amd64=$(awk '/amd64/ {sub("sha256:", "", $2); print $2}' <<< "$digests")
          arm64=$(awk '/arm64/ {sub("sha256:", "", $2); print $2}' <<< "$digests")
          if [ -z "$amd64" ] || [ -z "$arm64" ]; then
            echo "asset digests missing: $digests" >&2
            exit 1
          fi
          body=$(printf '%s\n' \
            "New release: https://github.com/crowdsecurity/cs-firewall-bouncer/releases/tag/$latest" \
            "" \
            "Read the release notes, then set in the Dockerfile:" \
            "" \
            '```' \
            "ARG VERSION=$latest" \
            "ARG SHA256_AMD64=$amd64" \
            "ARG SHA256_ARM64=$arm64" \
            '```' \
            "" \
            "The digests are the ones GitHub computed for the release assets.")
          gh issue create -R "$REPO" --title "$title" --body "$body"
